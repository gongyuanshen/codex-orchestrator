[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "tri-orchestrator"
version = "0.6.11"
description = "Multi-agent orchestrator daemon, SQLite WAL message board, isolated workspace manager, and stdio MCP shim for Codex"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "starlette>=0.40.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
    "pywin32>=311; sys_platform == 'win32'",
]

[project.scripts]
tri-orchestrator-mcp = "orchestrator.mcp_shim:main"
tri-orchestrator-daemon = "orchestrator.daemon:main"
tri-orchestrator-verify = "orchestrator.verify_runner:main"
tri-orchestrator-hook = "orchestrator.hook_runner:main"
tri-orchestrator-challenge = "orchestrator.challenge_runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]
